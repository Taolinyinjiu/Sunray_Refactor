# 基于Px4姿态环的控制器，主要调节参数有

sunray_attitude_gains:
  position:
    MPC_XY_P: 1.0 
    MPC_XY_I: 0.0
    MPC_XY_D: 0.0
    MPC_Z_P: 1.0 
    MPC_Z_I: 0.0
    MPC_Z_D: 0.0
  velocity:
    MPC_XY_VEL_P: 1.0 
    MPC_XY_VEL_I: 0.0
    MPC_XY_VEL_D: 0.0
    MPC_Z_VEL_P: 1.0 
    MPC_Z_VEL_I: 0.0
    MPC_Z_VEL_D: 0.0
  settings:
    anti_windup_threshold: 2.0